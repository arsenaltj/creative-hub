name: Codex badge checks
on:
  push:
    branches: [main]
    paths: ['projects/codex-usage-badge/**', 'build.mjs', 'projects.json', 'tests/portfolio.test.mjs', '.github/workflows/codex-badge-checks.yml']
  pull_request:
    paths: ['projects/codex-usage-badge/**', 'build.mjs', 'projects.json', 'tests/portfolio.test.mjs', '.github/workflows/codex-badge-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up locked browser test dependencies
        working-directory: projects/codex-usage-badge
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          npx playwright install chromium --only-shell
      - name: Build and audit public package
        run: |
          python projects/codex-usage-badge/scripts/build_hub_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
          python projects/codex-usage-badge/scripts/audit_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Privacy audit failed' }
          git diff --exit-code -- projects/codex-usage-badge/installer/Install-CodexUsageBadge.cmd projects/codex-usage-badge/release.json
      - name: Portfolio generation
        run: |
          node build.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portfolio build failed' }
          node --test tests/portfolio.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portfolio tests failed' }
          git diff --exit-code -- index.html README.md
      - name: Windows startup regression
        working-directory: projects/codex-usage-badge
        run: |
          foreach ($test in @('windows-startup','windows-startup-controller','startup-controller','windows-bridge','windows')) {
            node "tests/$test.cjs"
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $test" }
          }
      - name: Installer and download regression
        working-directory: projects/codex-usage-badge
        shell: powershell
        run: |
          ./tests/windows.ps1
          ./tests/windows-launch.ps1
          ./tests/hub-bootstrap.ps1
          ./tests/windows-native.ps1
