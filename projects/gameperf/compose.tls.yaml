# Optional: only use on a server where 80/443 are intentionally reserved for this stack.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GP_DOMAIN: ${GP_DOMAIN:?Set GP_DOMAIN in .env before enabling TLS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy-data:
  caddy-config:
