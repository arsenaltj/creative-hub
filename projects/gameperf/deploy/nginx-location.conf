# Put this INSIDE a new dedicated HTTPS server block in your existing Nginx.
# Configure certificates through your existing approved management process.
# Do not paste over an existing site's configuration. Use a dedicated subdomain.
location / {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
