async function api(path,method='GET',data=null,version=null){const headers={'X-GP-Client':'web'};if(data!==null)headers['Content-Type']='application/json';if(user?.csrf)headers['X-CSRF-Token']=user.csrf;if(version!=null)headers['If-Match']=String(version);let response;try{response=await fetch('/api'+path,{method,headers,credentials:'same-origin',body:data===null?undefined:JSON.stringify(data)});}catch(e){throw new Error('无法连接服务器。未切换到本地保存，请检查网络。');}let result;try{result=await response.json();}catch(e){throw new Error('服务器没有返回有效数据，请检查反向代理配置。');}if(!response.ok){if(response.status===401&&!['/login','/me'].includes(path))toast('登录已过期，请重新登录；当前未保存内容请先复制。',true);throw new Error(typeof result.detail==='string'?result.detail:'操作失败，请检查输入。');}return result;}

function startTour(){if(tourTimer){stopTour();return;}if(graphFocus){graphFocus='';renderPage();}const steps=[['orchestrator','接收目标与约束'],['diagnose','把问题变为可检验假设'],['optimize','提出最小候选改动'],['judge','独立核验真实证据'],['validate','回归与送测，发布另行审批'],['feedback','反馈成为新的任务'],['evolution','在独立任务上验证方法改进']];const tick=()=>{tourStep++;if(tourStep>=steps.length){stopTour();return;}const [id,note]=steps[tourStep];selectNode(id);$$('.tour-active').forEach(el=>el.classList.remove('tour-active'));$(`.graph-node[data-id="${id}"]`)?.classList.add('tour-active');$('#tour-caption').textContent=`演示 ${tourStep+1}/${steps.length} · ${note}（未执行任务）`;};tick();tourTimer=setInterval(tick,2600);$('[data-action="tour"]').innerHTML=icon('close',true)+'停止演示';}
function requirementsPage(){return heading('PRODUCT INTENT / REQUIREMENTS','需求与边界','这不是宣传页，而是你的游戏性能能力域：可维护、可追溯、可逐步接入业务。',button(icon('edit',true)+'维护项目目标','project','','primary'))+`<section class="intent-hero panel"><span class="eyebrow">ONE SYSTEM · TWO LOOPS · SHARED CAPABILITIES</span><h2>${esc(state.project.tagline)}</h2><p>${esc(state.project.goal)}</p><div class="intent-tags"><span>已有调参 Agent 保留</span><span>全生命周期</span><span>受控代码探索</span><span>独立验证方法进化</span></div></section><div class="intent-grid">${[['01','横向闭环','让业务从发现到交付形成闭环。','平台适配 → 复现诊断 → 参数 / 策略 / 代码候选 → 回归送测 → 媒体和用户反馈。','任务、实验、反馈记录已实现；执行链待接入。','task'],['02','纵向下钻','每个环节可以深入，但不无限拆 Agent。','保留现有高通参数调优 Agent，按需扩展 CPU、GPU、温控和具体策略；用契约明确边界。','节点编辑、父子关系和下钻已实现。','layers'],['03','方法进化','把产品改好，与让 Agent 变强分开验收。','用历史失败提出诊断、搜索、工具或流程候选，通过独立任务与可比预算验证。','候选和审核记录已实现；不自动评测或晋升。','evolve'],['04','向上组合 / 横向复用','你的系统是上层网络中的一个能力域。','向上接目标、约束、预算，返回结果、证据、风险；共享实验、分析、知识和版本能力。','回传 API 已实现；上层编排及资源调度待接入。','grid']].map(([num,t,h,p,status,ico])=>`<section class="panel intent-card"><div class="between"><span class="intent-number">${num}</span>${icon(ico)}</div><h3>${t}</h3><h2>${h}</h2><p>${p}</p><div class="intent-status">${icon('info',true)}${status}</div></section>`).join('')}</div><section class="panel mt20"><div class="panel-head"><div><div class="eyebrow">NON-NEGOTIABLE BOUNDARIES</div><h2>首版不跨越的边界</h2></div>${icon('shield')}</div><div class="boundary-grid">${[['没有虚构实时数据','动画展示信息关系，不代表设备在线、实验执行或性能提升。'],['不替换已有业务实现','工作台先承载任务、证据与接口，已有调参能力通过薄适配接入。'],['不开放任意远程命令','网页没有 SSH 或任意命令接口，部署链与业务系统分离。'],['不把示例变成生产结果','本机示例与服务器记录分开；审核意见不是自动评测或发布。']].map(([a,b])=>`<div>${icon('check',true)}<h3>${a}</h3><p>${b}</p></div>`).join('')}</div></section>`;}

function tasksPage(){const list=state.tasks.filter(matches);const ss=['planned','diagnosing','optimizing','review','done','blocked'];return heading('BUSINESS LOOP / 02','业务任务','一个任务，一个结果负责人。任务完成不等于产品发布。',createButton('tasks','新建任务'))+demoBanner()+`<div class="toolbar"><span class="muted">共 ${list.length} 项${query?'匹配任务':'任务'} · 点击卡片编辑目标、约束、阶段与状态</span><span class="badge purple">任务 → 实验 → 证据</span></div><div class="board">${ss.map(s=>{const col=list.filter(t=>t.status===s);return `<section class="board-col"><div class="board-col-head"><span class="row">${badge(s)}</span><span class="board-count">${col.length}</span></div>${col.map(t=>`<article class="task-card" data-action="edit" data-kind="tasks" data-id="${esc(t.id)}" tabindex="0" role="button"><div class="between"><span class="badge ${t.priority==='urgent'?'red':t.priority==='high'?'orange':''}">${({urgent:'紧急',high:'高优先级',normal:'常规'})[t.priority]||'常规'}</span>${sample(t)}</div><h3>${esc(t.title)}</h3><div class="card-meta">${icon('device',true)}${esc(t.device||'设备待定')}</div><div class="card-meta">${icon('chip',true)}${esc(t.game||'游戏待定')}</div><div class="card-bottom"><span>${esc(t.owner||'未指定负责人')}</span><span>${state.experiments.filter(e=>e.taskId===t.id).length} 条实验</span></div></article>`).join('')||'<div class="board-empty">暂无任务</div>'}</section>`;}).join('')}</div>`;}
function experimentsPage(){const list=state.experiments.filter(matches);return heading('EXPERIMENTS & EVIDENCE / 03','实验与证据','假设、版本、条件与原始证据，保留成功和失败。',createButton('experiments','记录实验'))+demoBanner()+notice('下列指标是录入或 Agent 回传值，不是工作台实测；单项变化不构成优化结论。提交后记录冻结，独立审核人记录判断。')+(list.length?`<div class="table-wrap"><table><thead><tr><th>实验 / 候选</th><th>关联任务</th><th>P95 帧时间（ms）</th><th>功耗（W）</th><th>重复次数</th><th>状态</th><th></th></tr></thead><tbody>${list.map(e=>`<tr class="clickable" data-action="edit" data-kind="experiments" data-id="${esc(e.id)}"><td><div class="table-title">${esc(e.title)}</div><div class="table-sub">${esc(e.candidate||'候选待补')} ${sample(e)}</div></td><td><div class="table-sub">${esc(get('tasks',e.taskId)?.title||e.taskId)}</div></td><td><span class="mono">${fmt(e.p95Baseline)} → ${fmt(e.p95Candidate)}</span></td><td><span class="mono">${fmt(e.powerBaseline)} → ${fmt(e.powerCandidate)}</span></td><td>${e.repeats||'—'}</td><td>${badge(e.status)}</td><td>${icon('chevron',true)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="panel">${empty('尚无实验记录','关联一个业务任务，记录候选、对照条件及原始证据。','experiments')}</div>`);}
function evolutionPage(){const list=state.evolutions.filter(matches);return heading('METHOD EVOLUTION / 04','能力进化','产品更好与 Agent 更强，分开验收、独立记录。',createButton('evolutions','提出能力候选'))+demoBanner()+notice('只记录诊断、搜索、工具与流程的候选改进。代码变更多、提示词更长或换了更强模型，都不能直接算作 Agent 自进化。','green')+(list.length?`<div class="cards-grid">${list.map(e=>`<article class="info-card"><div class="between"><span class="badge purple">${icon('evolve',true)}${esc(kinds[e.kind])}</span>${badge(e.status)}</div><h3>${esc(e.title)}</h3><p>${esc(e.result||'尚未记录独立验证结果')}</p><div class="card-divider"></div><dl class="kv"><dt>版本对照</dt><dd class="mono">${esc(e.oldVersion||'—')} → ${esc(e.candidateVersion||'—')}</dd><dt>独立任务集</dt><dd>${esc(e.holdout||'待指定')}</dd><dt>资源预算</dt><dd>${esc(e.budget||'待明确')}</dd></dl><div class="between"><span>${sample(e)}</span>${button('查看候选 '+icon('chevron',true),'edit',`data-kind="evolutions" data-id="${esc(e.id)}"`,'small')}</div></article>`).join('')}</div>`:`<div class="panel">${empty('先积累真实任务，再提出改进','从一个反复浪费实验资源的问题切入，建立旧版与候选方法的对照。','evolutions')}</div>`)+`<div class="bottom-grid"><section class="panel"><h2>产品优化闭环</h2><p class="section-intro">验收产品体验，不以补丁数量为目标。</p><div class="numbered"><b>1</b><div><h3>机制假设 → 参数 / 策略 / 代码候选</h3><p>生成最小可验证改动，限定允许动作。</p></div></div><div class="numbered"><b>2</b><div><h3>真机对照 → 回归 → 独立判断</h3><p>收益与副作用有证据，发布另行授权。</p></div></div></section><section class="panel"><h2>方法改进闭环</h2><p class="section-intro">验收研发能力，检查新任务上的表现。</p><div class="numbered"><b>1</b><div><h3>历史失败 → 方法候选 → 固定版本</h3><p>独立记录模型、工具、流程与评测版本。</p></div></div><div class="numbered"><b>2</b><div><h3>留出任务 → 可比预算 → 独立审核</h3><p>只有经过验证的方法才进入后续业务。</p></div></div></section></div>`;}

function capabilitiesPage(){const list=state.nodes.filter(n=>matches(n)&&(capabilityFilter==='all'||n.group===capabilityFilter));return heading('CAPABILITY REGISTRY / 06','能力目录','节点可持续拆分；确定性动作优先做成工具，不强行做成 Agent。',createButton('nodes','新增能力节点'))+`<div class="toolbar"><div class="segmented">${[['all','全部'],['business','业务环节'],['agent','Agent'],['capability','分析能力'],['shared','共享底座']].map(([v,t])=>`<button class="segment ${v===capabilityFilter?'active':''}" data-action="filter-capability" data-value="${v}">${t}</button>`).join('')}</div><span class="muted tiny">${list.length} 个节点 · 状态由人工维护，不代表连接探测结果</span></div><div class="table-wrap">${list.map(n=>`<div class="node-tree-row"><span class="node-emblem">${icon(nodeIcon(n))}</span><div class="tree-main"><h3>${esc(n.name)}</h3><p>${n.parentId?'隶属 '+esc(get('nodes',n.parentId)?.name||n.parentId)+' · ':''}${esc(n.subtitle)}</p></div><span class="node-group">${esc(groups[n.group])}</span>${badge(n.status==='planned'?'规划中':n.status)}${button(icon('edit'),'edit',`data-kind="nodes" data-id="${esc(n.id)}" aria-label="编辑 ${esc(n.name)}"`,'ghost icon-only')}</div>`).join('')||empty('没有匹配的能力','调整筛选条件或搜索关键词。')}</div>`;}
function integrationsPage(){const eventCount=DEMO?0:state.integration?.events||0;const base=DEMO?'https://你的域名':location.origin;return heading('CONNECT YOUR EXISTING AGENT / 07','业务接入','不重写现有高通调参 Agent，先让已有业务回传结构化结果。',button(icon('copy')+'复制接口示例','copy-api'))+notice('首版实现的是写入任务与实验草稿的 REST 接口，不包含模型调用、任务派发、SSH、刷机、自动改代码或自动发布。','amber')+`<div class="integrate-grid"><section class="panel"><div class="panel-head"><div><h2>现有调参 Agent → 工作台</h2><p>写入型令牌 · 幂等事件 · 只进草稿 · 不可审核</p></div><span class="badge ${eventCount?'green':''}">${eventCount?'收到 '+eventCount+' 条回传':'尚无真实回传'}</span></div><div class="numbered"><b>1</b><div><h3>在服务器签发最小权限令牌</h3><p>管理命令 create-token，默认有效期 30 天。凭证只保存在 Agent 运行环境，不写入网页和仓库。</p></div></div><div class="numbered"><b>2</b><div><h3>先上报任务，再上报实验草稿</h3><p>复用已有采集与搜索流程，提供机制假设、基线、候选与证据引用；接口返回工作台记录 ID。</p></div></div><div class="numbered"><b>3</b><div><h3>人工核验，独立审核，逐步自动化</h3><p>接口成功表示“记录已接收”，不表示实测完成、优化有效或审核通过。</p></div></div><pre class="code-box">${esc(`POST ${base}/api/ingest

async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制。');}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('浏览器不允许复制，请从接口示例手动复制。');toast('已复制。');}}
async function action(el){const a=el.dataset.action;switch(a){
case 'toggle-motion': motionEnabled=!motionEnabled;applyMotion();try{localStorage.setItem('gameperf-motion',motionEnabled?'on':'off');}catch(_){}if(!motionEnabled)stopTour();$$('.motion-text').forEach(n=>n.textContent=motionEnabled?'动效开':'动效关');toast(motionQuery.matches?'系统已启用减少动态效果，装饰动效保持关闭。':motionEnabled?'已启用链路装饰动效；不代表真实执行。':'已关闭装饰动效。');break;
case 'select-node':selectNode(el.dataset.id);break;
case 'graph-root':graphFocus='';selectedNode='orchestrator';graphFilter='all';renderPage();break;
case 'graph-up':{const n=get('nodes',graphFocus);graphFocus=n?.parentId||'';selectedNode=graphFocus||'orchestrator';renderPage();break;}
case 'drill-node':graphFocus=el.dataset.id;selectedNode=el.dataset.id;graphFilter='all';renderPage();break;
case 'graph-filter':graphFilter=el.dataset.value;renderPage();break;
case 'node-task':openRecord('tasks',null,{stageId:el.dataset.id,status:'planned',sample:DEMO,priority:'normal'});break;
case 'tour':startTour();break;
case 'present':document.body.classList.toggle('presentation-mode');if(!document.querySelector('.presentation-exit')){const exit=document.createElement('button');exit.className='btn presentation-exit';exit.dataset.action='present';exit.textContent='退出汇报模式 · Esc';document.body.append(exit);}break;
case 'menu':$('#sidebar').classList.toggle('open');break;case 'navigate':location.hash=el.dataset.route;break;case 'refresh':await refresh();toast('数据已刷新。');break;case 'export':exportData();break;case 'project':openRecord('project','main');break;case 'new':openRecord(el.dataset.kind);break;case 'edit':openRecord(el.dataset.kind,el.dataset.id);break;case 'close-modal':closeModal();break;case 'add-child':openRecord('nodes',null,{parentId:el.dataset.parent,group:'capability',status:'planned',owner:'待指定'});break;case 'task-experiment':{const t=get('tasks',el.dataset.id);openRecord('experiments',null,{taskId:t.id,device:t.device,game:t.game,baseline:t.baseline,status:'draft',sample:!!t.sample});break;}case 'duplicate':{const {kind,data}=modal;const copy={};for(const [key]of fields(kind))copy[key]=data[key];copy.title=(copy.title||'')+' · 新候选';copy.status='draft';copy.sample=!!data.sample;openRecord(kind,null,copy);break;}case 'delete-record':await deleteRecord();break;case 'review':await doReview(el.dataset.decision);break;case 'convert-feedback':await convertFeedback(el.dataset.id);break;case 'filter-capability':capabilityFilter=el.dataset.value;renderPage();break;case 'copy-api':await copyText(apiExample());break;case 'import':$('#import-file').click();break;case 'reset':if(confirm('将清除当前浏览器中的修改并恢复示例。建议先导出 JSON。确定继续？')){localMutation(()=>{state=clone(window.GP_DEMO);state.audit=[];});renderShell();toast('已恢复本机示例。');}break;case 'logout':await api('/logout','POST',{});user=null;renderLogin(true);break;case 'print':window.print();break;}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.disabled)return;try{await action(el);}catch(err){if(modal)showFormError(err.message);else toast(err.message,true);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stopTour();document.body.classList.remove('presentation-mode');if(modal)closeModal();else $('#sidebar')?.classList.remove('open');}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();$('#search')?.focus();}if(e.key==='Enter'&&e.target.matches('[role="button"][data-action]'))e.target.click();if(e.key==='Tab'&&modal){const focusable=$$('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]',$('#modal-root')).filter(x=>x.getClientRects().length);if(focusable.length){const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}});
window.addEventListener('hashchange',()=>{if(state){query='';if($('#search'))$('#search').value='';renderPage();$('#sidebar')?.classList.remove('open');window.scrollTo(0,0);}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
function renderLogin(initialized){state=null;$('#app').innerHTML=`<div class="login-page"><section class="login-art"><div class="brand"><span class="brand-symbol">${icon('bolt')}</span><span><div class="brand-title">GamePerf.</div><div class="brand-sub">INTELLIGENCE STUDIO</div></span></div><div><h1>让业务形成闭环，<br>让方法持续变强。</h1><p>从现有自动调参 Agent 出发，沉淀任务与实验，逐步建立可验证的游戏性能研发体系。</p><div class="login-visual"><span>平台适配</span><span>复现诊断</span><span>参数 / 代码</span><span>独立验证</span><span>反馈闭环</span><span>方法进化 ↻</span></div></div><div class="tiny muted">PRIVATE WORKSPACE · EVIDENCE FIRST</div></section><section class="login-panel"><div class="login-card"><div class="eyebrow">YOUR TEAM WORKSPACE</div><h2>${initialized?'登录研发工作台':'初始化你的工作台'}</h2><p>${initialized?'使用服务器管理员创建的账号登录。':'没有默认账号或公开注册，请先在服务器创建管理员。'}</p><div id="login-error"></div>${initialized?`<form id="login-form"><div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="64"></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"></div><button class="btn primary" type="submit">登录工作台 ${icon('chevron',true)}</button></form>`:`<pre class="code-box">docker compose exec app \\\n  python manage.py create-user admin \\\n  --role admin</pre><p class="muted tiny">密码在服务器终端交互输入，不要写在聊天或源码中。创建后刷新页面。</p>${button(icon('refresh')+'重新检查','refresh-setup')}`}<div class="login-note">${icon('lock',true)} 这是私有记录工作台，不会自动执行调度代码或访问设备。涉及公司代码和日志前，请确认允许使用的环境。</div></div></section></div>`;if($('#login-form'))$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('button',e.target);btn.disabled=true;try{user=await api('/login','POST',{username:$('#username').value,password:$('#password').value});state=await api('/workspace');user=state.user;renderShell();}catch(err){$('#login-error').innerHTML=`<div class="form-error">${esc(err.message)}</div>`;btn.disabled=false;}});$('[data-action="refresh-setup"]')?.addEventListener('click',boot);}
async function boot(){try{if(DEMO){let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){toast('当前浏览器可能不支持持久保存，请及时导出 JSON。',true);}state=saved?JSON.parse(saved):clone(window.GP_DEMO);state.audit??=[];user={name:'本机演示',role:'demo'};renderShell();return;}const info=await api('/info');if(!info.initialized){renderLogin(false);return;}try{user=await api('/me');}catch(e){renderLogin(true);return;}state=await api('/workspace');user=state.user;renderShell();}catch(err){$('#app').innerHTML=`<div class="boot"><div>工作台暂未载入</div><span>${esc(err.message)}</span><button class="btn" id="boot-retry">重试</button></div>`;$('#boot-retry').addEventListener('click',boot);}}
document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('tab-inactive',document.hidden);if(document.hidden)stopTour();});
boot();
})();
