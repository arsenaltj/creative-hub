name: gameperf-studio
services:
  app:
    image: gameperf-studio:${GP_IMAGE_TAG:-0.3.0}
    build: .
    restart: unless-stopped
    environment:
      GP_DATA_DIR: /data
      GP_ORIGIN: ${GP_ORIGIN:-http://localhost:8765}
      GP_COOKIE_SECURE: ${GP_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:${GP_PORT:-8765}:8765"
    volumes:
      - studio-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  studio-data:
