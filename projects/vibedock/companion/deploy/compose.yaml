services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      VIBEDOCK_PUBLIC_ORIGIN: ${VIBEDOCK_PUBLIC_ORIGIN:?Run relay:init first}
      VIBEDOCK_RELAY_HOST_KEY: ${VIBEDOCK_RELAY_HOST_KEY:?Run relay:init first}
      VIBEDOCK_RELAY_PORT: 8080
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      VIBEDOCK_DOMAIN: ${VIBEDOCK_DOMAIN:?Run relay:init first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [relay]
volumes:
  caddy_data:
  caddy_config:
